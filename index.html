<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0c0f">
<title>🔒 Secure Number Info</title>
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;
    font-family:-apple-system,BlinkMacSystemFont,'Courier New',monospace;
    -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;}

  body{
    background:#0a0c0f;color:#00ff9d;min-height:100vh;
    padding:12px;display:flex;justify-content:center;align-items:center;
    overflow-x:hidden;
  }

  /* ============ LOGIN SCREEN ============ */
  .login-wrap{
    width:100%;max-width:400px;margin:auto;
    background:#0f1318;border:2px solid #00ff9d;border-radius:12px;
    padding:28px 20px;box-shadow:0 0 40px rgba(0,255,157,.3);
    position:relative;
  }
  .login-wrap::before{
    content:'';position:absolute;inset:0;border-radius:12px;
    background:repeating-linear-gradient(0deg,
      rgba(0,255,157,.03) 0,rgba(0,255,157,.03) 1px,
      transparent 1px,transparent 4px);
    pointer-events:none;
  }
  .lock-icon{
    font-size:2.5rem;text-align:center;margin-bottom:8px;
    text-shadow:0 0 20px #00ff9d;
    animation:flicker 3s infinite alternate;
  }
  @keyframes flicker{0%,100%{opacity:1}93%{opacity:.5}94%{opacity:1}}

  .login-wrap h1{
    font-size:1.15rem;text-align:center;margin-bottom:6px;
    text-shadow:0 0 10px #00ff9d;letter-spacing:1.5px;
  }
  .login-wrap .sub{
    text-align:center;color:#00cc7a;font-size:.7rem;
    letter-spacing:1px;margin-bottom:22px;
    border-bottom:1px dashed #00ff9d33;padding-bottom:14px;
  }

  .field{margin-bottom:14px;position:relative;z-index:2;}
  .field label{
    display:block;color:#00cc7a;font-size:.7rem;
    letter-spacing:1px;margin-bottom:6px;
  }
  .field input{
    width:100%;padding:13px 12px;background:#0a0c0f;
    border:1px solid #00ff9d66;border-radius:8px;
    color:#00ff9d;font-family:inherit;font-size:16px;
    outline:none;letter-spacing:1px;
    -webkit-appearance:none;appearance:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .field input:focus{
    border-color:#00ff9d;box-shadow:0 0 15px #00ff9d44;
  }
  .field input::placeholder{color:#00ff9d44;font-size:14px;letter-spacing:0;}

  .login-btn{
    width:100%;padding:14px;background:#00ff9d;border:none;
    border-radius:8px;color:#0a0c0f;font-family:inherit;
    font-size:15px;font-weight:bold;cursor:pointer;
    text-transform:uppercase;letter-spacing:1px;
    margin-top:8px;-webkit-appearance:none;appearance:none;
    transition:all .2s;min-height:50px;
  }
  .login-btn:active{transform:scale(.97);background:#00cc7a;}
  .login-btn:disabled{background:#00ff9d44;cursor:not-allowed;}

  .login-error{
    background:#ff3b3b22;border:1px solid #ff3b3b;border-radius:6px;
    padding:10px;color:#ff6b6b;font-size:.8rem;text-align:center;
    margin-top:12px;display:none;
  }
  .login-error.show{display:block;animation:shake .3s;}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-6px)}
    75%{transform:translateX(6px)}
  }

  .login-footer{
    text-align:center;color:#00ff9d55;font-size:.65rem;
    margin-top:16px;padding-top:12px;
    border-top:1px dashed #00ff9d22;
  }

  /* ============ MAIN APP ============ */
  .app-wrap{
    width:100%;max-width:900px;margin:0 auto;
    background:#0f1318;border:2px solid #00ff9d;border-radius:12px;
    padding:16px 12px;box-shadow:0 0 30px rgba(0,255,157,.3);
    display:none;
  }
  .app-wrap.show{display:block;}

  .header-bar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:12px;padding-bottom:10px;
    border-bottom:1px dashed #00ff9d44;
    gap:8px;flex-wrap:wrap;
  }
  .header-bar .welcome{
    color:#00cc7a;font-size:.75rem;letter-spacing:.5px;
  }
  .header-bar .welcome b{color:#00ff9d;}
  .header-bar .logout{
    padding:7px 12px;background:#ff3b3b22;
    border:1px solid #ff3b3b;border-radius:6px;
    color:#ff6b6b;font-family:inherit;font-size:.72rem;
    font-weight:bold;cursor:pointer;letter-spacing:.5px;
    -webkit-appearance:none;appearance:none;
  }
  .header-bar .logout:active{background:#ff3b3b44;}

  h1{
    font-size:1.2rem;text-align:center;margin-bottom:6px;
    text-shadow:0 0 10px #00ff9d;letter-spacing:1.5px;
  }
  .subtitle{
    text-align:center;color:#00cc7a;font-size:.7rem;
    margin-bottom:14px;letter-spacing:.5px;
    border-bottom:1px dashed #00ff9d44;padding-bottom:10px;
  }

  .input-group{display:flex;gap:8px;margin-bottom:12px;}
  .input-group input{
    flex:1 1 auto;min-width:0;padding:13px 12px;background:#0a0c0f;
    border:1px solid #00ff9d66;border-radius:8px;color:#00ff9d;
    font-family:inherit;font-size:16px;outline:none;letter-spacing:1px;
    -webkit-appearance:none;
  }
  .input-group input:focus{border-color:#00ff9d;box-shadow:0 0 15px #00ff9d44;}
  .input-group input::placeholder{color:#00ff9d55;letter-spacing:0;font-size:14px;}
  .input-group button{
    padding:13px 16px;background:#00ff9d;border:none;border-radius:8px;
    color:#0a0c0f;font-family:inherit;font-size:16px;font-weight:bold;
    cursor:pointer;text-transform:uppercase;-webkit-appearance:none;
    min-height:48px;
  }
  .input-group button:active{transform:scale(.96);}
  .input-group button:disabled{background:#00ff9d44;}

  .action-bar{display:flex;gap:8px;margin-bottom:10px;}
  .action-bar button{
    flex:1;padding:11px 6px;background:#0a1a12;
    border:1px solid #00ff9d66;border-radius:8px;
    color:#00ff9d;font-family:inherit;font-size:12px;font-weight:bold;
    cursor:pointer;-webkit-appearance:none;user-select:none;min-height:44px;
  }
  .action-bar button:active{transform:scale(.97);background:#00ff9d22;}
  .action-bar button:disabled{opacity:.35;}
  .action-bar button.copied{background:#00ff9d;color:#0a0c0f;}

  .terminal{
    background:#050709;border:1px solid #00ff9d44;border-radius:8px;
    padding:12px 10px;min-height:220px;max-height:55vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;font-size:.8rem;line-height:1.5;
    word-break:break-word;-webkit-user-select:text;user-select:text;
  }
  .terminal::-webkit-scrollbar{width:4px;}
  .terminal::-webkit-scrollbar-thumb{background:#00ff9d;border-radius:2px;}

  .terminal .prompt{color:#00ff9d;white-space:pre-wrap;word-break:break-word;}
  .terminal .prompt::before{content:'> ';color:#00cc7a;user-select:none;}
  .terminal .error{color:#ff3b3b;}
  .terminal .success{color:#00ff9d;}
  .terminal .info{color:#00ccff;}
  .terminal .warn{color:#ffaa00;}

  .result-card{
    background:linear-gradient(135deg,#0a1a12,#0d2018);
    border:1px solid #00ff9d;border-radius:8px;
    padding:12px;margin-top:10px;
  }
  .result-card .record-header{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #00ff9d44;
  }
  .result-card .record-num{color:#00cc7a;font-size:.65rem;letter-spacing:1.5px;}
  .result-card .circle-badge{
    padding:2px 7px;background:#00ff9d22;border:1px solid #00ff9d66;
    color:#00ff9d;border-radius:4px;font-size:.6rem;font-weight:bold;
  }
  .result-card .row{
    display:flex;flex-direction:column;gap:2px;padding:6px 0;
    border-bottom:1px dashed #00ff9d22;font-size:.82rem;
  }
  .result-card .row:last-child{border-bottom:none;}
  .result-card .label{color:#00cc7a;font-size:.65rem;}
  .result-card .value{color:#00ff9d;word-break:break-word;-webkit-user-select:text;user-select:text;}
  .result-card .value.null{color:#666;font-style:italic;}

  .summary{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;}
  .summary .stat{
    padding:8px 4px;background:#0a1a12;border:1px solid #00ff9d66;
    border-radius:6px;text-align:center;
  }
  .summary .stat .num{font-size:.9rem;color:#00ff9d;font-weight:bold;word-break:break-all;}
  .summary .stat .lbl{font-size:.55rem;color:#00cc7a;margin-top:3px;}

  .quick-links{margin-top:8px;font-size:.68rem;color:#00ff9d66;
    text-align:center;line-height:1.5;}
  .quick-links span{color:#ffcc00;cursor:pointer;text-decoration:underline;
    margin:0 4px;padding:4px 6px;display:inline-block;user-select:none;}

  .status-bar{display:flex;justify-content:space-between;gap:8px;
    margin-top:12px;font-size:.65rem;color:#00ff9d88;
    border-top:1px dashed #00ff9d33;padding-top:8px;flex-wrap:wrap;}
  .status-dot{display:inline-block;width:7px;height:7px;background:#00ff9d;
    border-radius:50%;margin-right:5px;box-shadow:0 0 8px #00ff9d;
    animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  .blinking-cursor{display:inline-block;width:8px;height:13px;background:#00ff9d;
    animation:blink 1s step-end infinite;vertical-align:middle;margin-left:3px;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

  .toast{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:#00ff9d;color:#0a0c0f;padding:11px 18px;border-radius:8px;
    font-size:.82rem;font-weight:bold;box-shadow:0 0 25px rgba(0,255,157,.6);
    opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
    z-index:9999;user-select:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .toast.error{background:#ff3b3b;color:#fff;}

  @media (max-width:400px){
    h1{font-size:1.05rem;}
    .action-bar button{font-size:11px;padding:9px 4px;}
  }
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════ -->
<!-- LOGIN SCREEN -->
<!-- ═══════════════════════════════════════════ -->
<div class="login-wrap" id="loginScreen">
  <div class="lock-icon">🔒</div>
  <h1>SECURE ACCESS</h1>
  <p class="sub">[ AUTHORIZED USERS ONLY ]</p>

  <div class="field">
    <label>USERNAME</label>
    <input type="text" id="loginUser" placeholder="Enter username" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
  </div>

  <div class="field">
    <label>PASSWORD</label>
    <input type="password" id="loginPass" placeholder="Enter password" autocomplete="off" />
  </div>

  <button class="login-btn" id="loginBtn" type="button">🔓 LOGIN</button>

  <div class="login-error" id="loginError"></div>

  <div class="login-footer">
    ⚡ Protected Tool · v2.0
  </div>
</div>

<!-- ═══════════════════════════════════════════ -->
<!-- MAIN APP (hidden until login) -->
<!-- ═══════════════════════════════════════════ -->
<div class="app-wrap" id="appScreen">
  <div class="header-bar">
    <span class="welcome">👤 Welcome, <b id="userDisplay">—</b></span>
    <button class="logout" id="logoutBtn" type="button">🚪 LOGOUT</button>
  </div>

  <h1>⚡ NUMBER INFO ⚡</h1>
  <p class="subtitle">[ MOBILE → OWNER INFO ]</p>

  <div class="input-group">
    <input type="tel" id="numInput" placeholder="10-digit number" autocomplete="off" maxlength="10" inputmode="numeric" />
    <button id="lookupBtn" type="button">GO</button>
  </div>

  <div class="action-bar">
    <button id="copyJsonBtn" type="button" disabled>📋 JSON</button>
    <button id="copyCardsBtn" type="button" disabled>📄 Info</button>
    <button id="clearBtn" type="button">🗑 Clear</button>
  </div>

  <div class="terminal" id="terminal">
    <div class="prompt">Logged in successfully. Ready...</div>
    <div class="prompt">Enter 10-digit mobile number.<span class="blinking-cursor"></span></div>
  </div>

  <div class="quick-links">
    Test: <span data-num="9876543210">9876543210</span> · <span data-num="9724130541">9724130541</span>
  </div>

  <div class="status-bar">
    <span><span class="status-dot"></span>Secure Mode</span>
    <span id="statusText">READY</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  // ═══════════════════════════════════════════════════════════════
  // 👥 USERS LIST — ફક્ત અહીં add/remove કરો
  //    નવો user ઉમેરવો હોય તો નીચે લાઈન paste કરો:
  //    { u: "username", p: "password", name: "Display Name" },
  // ═══════════════════════════════════════════════════════════════
  var USERS = [
    { u: "admin",     p: "admin@123",   name: "Administrator" },
    { u: "arpit",     p: "arpit@2026",  name: "Arpit" },
    { u: "test",      p: "test123",     name: "Test User" }
    // 👇 નવા users અહીં ઉમેરો
    // { u: "user4", p: "pass4", name: "User Four" },
  ];

  // Session key (localStorage માં saved)
  var SESSION_KEY = 'ni_secure_session_v2';

  // ═══════════════════════════════════════════════════════════════
  // API CONFIG
  // ═══════════════════════════════════════════════════════════════
  var API_KEY  = 'arpitsinhraol_9ec15467d3a281a004';
  var API_BASE = 'https://api-hub-alpha.vercel.app/api/number-info';

  // CORS proxies for file:// support
  var PROXIES = [
    function(u){ return 'https://corsproxy.io/?' + encodeURIComponent(u); },
    function(u){ return 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u); },
    function(u){ return 'https://thingproxy.freeboard.io/fetch/' + u; },
    function(u){ return u; }
  ];

  // ═══════════════════════════════════════════════════════════════
  // DOM ELEMENTS
  // ═══════════════════════════════════════════════════════════════
  var loginScreen  = document.getElementById('loginScreen');
  var appScreen    = document.getElementById('appScreen');
  var loginUser    = document.getElementById('loginUser');
  var loginPass    = document.getElementById('loginPass');
  var loginBtn     = document.getElementById('loginBtn');
  var loginError   = document.getElementById('loginError');
  var userDisplay  = document.getElementById('userDisplay');
  var logoutBtn    = document.getElementById('logoutBtn');

  var numInput     = document.getElementById('numInput');
  var lookupBtn    = document.getElementById('lookupBtn');
  var terminal     = document.getElementById('terminal');
  var statusText   = document.getElementById('statusText');
  var copyJsonBtn  = document.getElementById('copyJsonBtn');
  var copyCardsBtn = document.getElementById('copyCardsBtn');
  var clearBtn     = document.getElementById('clearBtn');
  var toastEl      = document.getElementById('toast');

  var lastRawJSON = '', lastPrettyText = '';
  var toastTimer;

  // ═══════════════════════════════════════════════════════════════
  // TOAST
  // ═══════════════════════════════════════════════════════════════
  function showToast(msg, isErr){
    toastEl.textContent = msg;
    toastEl.classList.toggle('error', !!isErr);
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1600);
  }

  // ═══════════════════════════════════════════════════════════════
  // LOGIN SYSTEM
  // ═══════════════════════════════════════════════════════════════
  function showLoginError(msg){
    loginError.textContent = msg;
    loginError.classList.add('show');
    setTimeout(function(){ loginError.classList.remove('show'); }, 3000);
  }

  function doLogin(){
    var u = loginUser.value.trim();
    var p = loginPass.value;

    if (!u || !p){
      showLoginError('❌ Username અને Password બંને દાખલ કરો');
      return;
    }

    // Find matching user
    var found = null;
    for (var i = 0; i < USERS.length; i++){
      if (USERS[i].u === u && USERS[i].p === p){
        found = USERS[i];
        break;
      }
    }

    if (!found){
      showLoginError('❌ Invalid username or password');
      loginPass.value = '';
      return;
    }

    // Save session
    try {
      localStorage.setItem(SESSION_KEY, JSON.stringify({
        u: found.u,
        name: found.name,
        time: Date.now()
      }));
    } catch(e){}

    // Show app
    userDisplay.textContent = found.name;
    loginScreen.style.display = 'none';
    appScreen.classList.add('show');
    numInput.focus();

    setTimeout(function(){
      showToast('✅ Welcome, ' + found.name + '!');
    }, 200);
  }

  function checkSession(){
    try {
      var raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return false;
      var s = JSON.parse(raw);
      // Session valid if found in users list still
      for (var i = 0; i < USERS.length; i++){
        if (USERS[i].u === s.u){
          userDisplay.textContent = s.name;
          loginScreen.style.display = 'none';
          appScreen.classList.add('show');
          return true;
        }
      }
    } catch(e){}
    return false;
  }

  function doLogout(){
    try { localStorage.removeItem(SESSION_KEY); } catch(e){}
    appScreen.classList.remove('show');
    loginScreen.style.display = 'block';
    loginUser.value = '';
    loginPass.value = '';
    loginError.classList.remove('show');
    terminal.innerHTML = '<div class="prompt">Logged out.</div>';
    setTimeout(function(){ loginUser.focus(); }, 300);
  }

  // ═══════════════════════════════════════════════════════════════
  // CLIPBOARD (iOS multi-fallback)
  // ═══════════════════════════════════════════════════════════════
  function copyToClipboard(text){
    if (navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text)
        .then(function(){ return true; })
        .catch(function(){ return fallbackCopy(text); });
    }
    return Promise.resolve(fallbackCopy(text));
  }
  function fallbackCopy(text){
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;top:0;left:0;width:2em;height:2em;font-size:16px;opacity:0;';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, 999999);
      var range = document.createRange();
      range.selectNodeContents(ta);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      var ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch(e){ return false; }
  }

  // ═══════════════════════════════════════════════════════════════
  // HELPERS
  // ═══════════════════════════════════════════════════════════════
  function addLine(text, cls){
    var div = document.createElement('div');
    div.className = 'prompt ' + (cls||'');
    div.innerHTML = text;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
  }
  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function esc(v){
    if (v===null||v===undefined||v==='N/A'||v===''||v==='NA')
      return '<span class="value null">N/A</span>';
    return '<span class="value">'+escapeHTML(v)+'</span>';
  }

  function buildRecordCard(rec, idx){
    var card = document.createElement('div');
    card.className='result-card';
    var rows=[['NAME',rec.name],['FATHER',rec.father_name],['MOBILE',rec.mobile],
      ['ALT',rec.alt_number],['ADDRESS',rec.address],['CIRCLE',rec.circle],
      ['EMAIL',rec.email],['ID',rec.id]];
    var h='<div class="record-header"><span class="record-num">▸ #'+(idx+1)+'</span>'+
      (rec.circle?'<span class="circle-badge">'+escapeHTML(rec.circle)+'</span>':'')+'</div>';
    for(var i=0;i<rows.length;i++){
      h+='<div class="row"><span class="label">'+rows[i][0]+'</span>'+esc(rows[i][1])+'</div>';
    }
    card.innerHTML=h;
    return card;
  }
  function buildSummary(p){
    var w=document.createElement('div');
    w.className='summary';
    w.innerHTML='<div class="stat"><div class="num">'+(p.total_records!=null?p.total_records:'—')+
      '</div><div class="lbl">RECORDS</div></div>'+
      '<div class="stat"><div class="num">'+(p.number||'—')+'</div><div class="lbl">NUMBER</div></div>'+
      '<div class="stat"><div class="num">'+(p.status?'TRUE':'FALSE')+'</div><div class="lbl">STATUS</div></div>';
    return w;
  }
  function buildPrettyText(p){
    var l=[];
    l.push('===== NUMBER INFO =====');
    l.push('Number : '+(p.number||'—'));
    l.push('Records: '+(p.total_records||0));
    l.push('Status : '+(p.status?'TRUE':'FALSE'));
    l.push('');
    (p.data||[]).forEach(function(r,i){
      l.push('--- Record #'+(i+1)+' ---');
      l.push('Name       : '+(r.name||'N/A'));
      l.push('Father     : '+(r.father_name||'N/A'));
      l.push('Mobile     : '+(r.mobile||'N/A'));
      l.push('Alt Number : '+(r.alt_number||'N/A'));
      l.push('Address    : '+(r.address||'N/A'));
      l.push('Circle     : '+(r.circle||'N/A'));
      l.push('Email      : '+(r.email||'N/A'));
      l.push('ID         : '+(r.id||'N/A'));
      l.push('');
    });
    return l.join('\n');
  }

  // ═══════════════════════════════════════════════════════════════
  // FETCH WITH PROXY
  // ═══════════════════════════════════════════════════════════════
  function fetchWithProxy(targetUrl){
    var attempt = 0;
    function tryNext(){
      if (attempt >= PROXIES.length)
        return Promise.reject(new Error('All proxies failed'));
      var proxyUrl = PROXIES[attempt](targetUrl);
      attempt++;
      return fetch(proxyUrl,{method:'GET',cache:'no-store',headers:{'Accept':'application/json'}})
        .then(function(r){
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        })
        .then(function(text){
          var parsed = JSON.parse(text);
          return { text: text, data: parsed };
        })
        .catch(function(err){ return tryNext(); });
    }
    return tryNext();
  }

  // ═══════════════════════════════════════════════════════════════
  // MAIN LOOKUP
  // ═══════════════════════════════════════════════════════════════
  function performLookup(){
    var num = numInput.value.trim();
    if (!num){ addLine('❌ Number empty','error'); return; }
    if (!/^\d{10}$/.test(num)){ addLine('❌ 10-digit number દાખલ કરો','error'); return; }

    numInput.blur();
    lookupBtn.disabled = true;
    copyJsonBtn.disabled = true;
    copyCardsBtn.disabled = true;
    statusText.textContent = 'QUERYING...';
    terminal.innerHTML = '';
    lastRawJSON = ''; lastPrettyText = '';

    addLine('['+new Date().toLocaleTimeString()+'] Looking up '+num,'info');

    var url = API_BASE+'?key='+API_KEY+'&mobile='+encodeURIComponent(num)+'&_t='+Date.now();

    fetchWithProxy(url)
    .then(function(result){
      var data = result.data;
      lastRawJSON = JSON.stringify(data, null, 2);
      addLine('✅ Response received','success');

      if (data && data.success && data.data && Array.isArray(data.data.data)){
        var p = data.data;
        lastPrettyText = buildPrettyText(p);
        addLine('📋 <b>'+p.total_records+'</b> record(s)','success');
        terminal.appendChild(buildSummary(p));
        for (var i=0;i<p.data.length;i++) terminal.appendChild(buildRecordCard(p.data[i],i));
        terminal.scrollTop = terminal.scrollHeight;
        statusText.textContent = 'SUCCESS ('+p.total_records+')';
        copyJsonBtn.disabled = false;
        copyCardsBtn.disabled = false;
      } else {
        addLine('ℹ No records','warn');
        statusText.textContent = 'NO DATA';
      }
    })
    .catch(function(err){
      addLine('❌ Failed: '+(err.message||'unknown'),'error');
      addLine('• API down / CORS block','warn');
      statusText.textContent = 'FAILED';
    })
    .then(function(){
      lookupBtn.disabled = false;
      if (statusText.textContent === 'QUERYING...') statusText.textContent = 'READY';
    });
  }
